<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTools - Productos</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/pages/productos.css">
    <link rel="stylesheet" href="css/pages/carrito.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/c32a0c7e4b.js" crossorigin="anonymous"></script>
    <link rel="icon" href="assets/logo llave.png">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="./index.html" class="logo"><img src="assets/logo.png" alt="StockTools - Inicio"></a>
            <ul class="nav-links">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
            <button class="btn-carrito-header" id="abrirCarrito" type="button" aria-label="Abrir carrito">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM1 2h3.27l.94 2H21a1 1 0 0 1 .96 1.27l-2.5 8.5A2 2 0 0 1 17.54 15H8.1l-1.1 2H19v2H7a2 2 0 0 1-1.75-2.97L6.6 13.6 3 4H1V2Zm6.16 4 2.18 7h8.2l2.06-7H7.16Z"/></svg>
                <span class="carrito-contador" id="contadorCarrito" hidden>0</span>
            </button>
            <button class="iniciar-sesion" type="button">Iniciar sesión</button>
        </nav>
    </header>

    <main>
        <div class="productos-wrap">
            <div class="productos-encabezado">
                <h1 class="productos-titulo">Todos nuestros productos</h1>
                <div class="productos-busqueda">
                    <input type="search" id="busqueda" placeholder="Buscar por nombre, marca o categoría…" aria-label="Buscar productos">
                    <span class="productos-contador" id="contadorResultados" aria-live="polite"></span>
                </div>
            </div>
            <div id="grilla"></div>
        </div>
    </main>

    <footer>
        <ul class="footer-nav">
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="./nosotros.html">Nosotros</a></li>
            <li><a href="./productos.html">Productos</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
        </ul>
        <div class="footer-social">
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>
    <script src="JS/carrito.js"></script>
    <script src="JS/catalogo.js"></script>
    <script src="JS/productos.js"></script>
</body>
</html>
